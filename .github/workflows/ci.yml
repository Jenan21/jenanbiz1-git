name: Continuous verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs only read the repository; nothing here needs to write to it or to the checks API.
permissions:
  contents: read

env:
  AUTH_SECRET: ci-auth-secret-not-for-production
  DATABASE_URL: postgresql://jenanbiz_app:ci-postgres-password@127.0.0.1:5432/jenanbiz?schema=public
  METRICS_TOKEN: ci-metrics-token-not-for-production
  REDIS_URL: redis://127.0.0.1:6379

jobs:
  verify:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: jenanbiz
          POSTGRES_USER: jenanbiz_app
          POSTGRES_PASSWORD: ci-postgres-password
        options: >-
          --health-cmd "pg_isready -U jenanbiz_app -d jenanbiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npx prisma generate
      - run: npm run db:migrate
      - run: npx prisma migrate status
      - run: npm run academy:seed
      # The home world map ships as a generated static asset; fail when it no longer matches its source data.
      - run: node scripts/generate-world-map.mjs --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # Shipped dependencies must be clean. Development tooling may carry advisories that have no patch yet
      # (see SECURITY.md); only a critical one fails the build there.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Audit all dependencies
        run: npm audit --audit-level=critical

  # Every group starts its own application server, database and cache, so the groups run side by side and the whole
  # suite finishes in the time of the slowest group instead of the sum of all of them.
  e2e:
    name: E2E (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: home-and-layout
            projects: >-
              --project=home-visual --project=home-panel-links --project=social-auth
              --project=visual-desktop-ar --project=visual-desktop-en --project=visual-laptop-ar --project=visual-laptop-en
              --project=visual-tablet-ar --project=visual-tablet-en --project=visual-mobile-ar --project=visual-mobile-en
          - name: auth
            projects: >-
              --project=auth-visual-acceptance --project=auth-flow-responsive --project=user-center-responsive
              --project=auth-chromium --project=account-approval --project=page-shortcuts
          - name: admin
            projects: >-
              --project=admin-control-panel --project=admin-operations-full-flow --project=mission-engine
              --project=knowledge-versioning --project=model-tool-governance --project=operations-observability
              --project=report-pages
          - name: projects-and-academy
            projects: >-
              --project=projects-section --project=projects-flow-routes --project=project-invitations --project=academy-flow-routes
              --project=academy-content-library
          - name: market-talent-marketing
            projects: >-
              --project=market-full-flow --project=talent-full-flow --project=marketing-full-flow
          - name: studio-software-programs
            projects: >-
              --project=studio-full-flow --project=software-full-flow --project=programs-full-flow
              --project=robotics-full-flow
          - name: routes-and-journey
            projects: >-
              --project=supplemental-pages --project=authoritative-ui-routes --project=platform-user-journey
              --project=link-integrity --project=security-sweep
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: jenanbiz
          POSTGRES_USER: jenanbiz_app
          POSTGRES_PASSWORD: ci-postgres-password
        options: >-
          --health-cmd "pg_isready -U jenanbiz_app -d jenanbiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npx prisma generate
      - run: npm run db:migrate
      - run: npm run academy:seed
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium
      - name: Run the browser tests
        # The sign-in redirects are built from the public origin, so it must be the address the test server listens on.
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3101
        run: npm run test:e2e -- ${{ matrix.group.projects }}
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.group.name }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The browser groups above run a development server. This job runs the real production build, the way it is deployed:
  # behind the private gate, with Redis rate limits, the enforced content security policy and production-only code paths.
  production-build:
    name: Production build (CSP audit and load)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CSP_AUDIT: "1"
      CSP_AUDIT_GATE_PASSWORD: ci-gate-password-not-for-production
      CSP_AUDIT_GATE_USER: ci-gate
      LOADTEST_BASE_URL: http://127.0.0.1:3102
      LOADTEST_GATE_PASSWORD: ci-gate-password-not-for-production
      LOADTEST_GATE_USER: ci-gate
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3102
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3102
      SITE_ACCESS_PASSWORD: ci-gate-password-not-for-production
      SITE_ACCESS_USERNAME: ci-gate
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: jenanbiz
          POSTGRES_USER: jenanbiz_app
          POSTGRES_PASSWORD: ci-postgres-password
        options: >-
          --health-cmd "pg_isready -U jenanbiz_app -d jenanbiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
      redis:
        image: redis:7.4-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npx prisma generate
      - run: npm run db:migrate
      - run: npm run academy:seed
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium
      - name: Start the production server
        run: |
          nohup npx next start -H 127.0.0.1 -p 3102 > server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3102/api/health/ready > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3102/api/health/ready
      - name: Audit the content security policy
        run: npm run test:e2e:csp
      - name: Load and abuse test
        run: npm run loadtest -- --duration 8
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-build
          path: |
            server.log
            test-results/
          retention-days: 7
          if-no-files-found: ignore
