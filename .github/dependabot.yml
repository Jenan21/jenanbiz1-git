version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor releases arrive together, so a week of routine updates is one pull request.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Prisma, its adapter and the generated client are pinned to one exact version on purpose; bump them together.
      - dependency-name: "prisma"
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/client"
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/adapter-pg"
        update-types: [version-update:semver-major]
      # Toolchain majors change the compiler, linter and test runner together with the framework; do those by hand.
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]
      - dependency-name: "vitest"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: "next"
        update-types: [version-update:semver-major]
      - dependency-name: "react"
        update-types: [version-update:semver-major]
      - dependency-name: "react-dom"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The runtime matches Vercel's Node 24 and the engines range; move it deliberately, not through a bot.
      - dependency-name: "node"
        update-types: [version-update:semver-major]
