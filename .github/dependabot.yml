version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor releases arrive together, so a week of routine updates is one pull request.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Prisma, its adapter and the generated client are pinned to one exact version on purpose; bump them together.
      - dependency-name: "prisma"
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/client"
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/adapter-pg"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
